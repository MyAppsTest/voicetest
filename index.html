  <script>
    const modal = document.getElementById('modal');
    const openModal = () => modal.classList.add('show');
    const closeModal = () => modal.classList.remove('show');
    document.getElementById('demoBtn').addEventListener('click', openModal);
    document.getElementById('ctaBtn').addEventListener('click', openModal);
    document.getElementById('closeModal').addEventListener('click', closeModal);
    modal.addEventListener('click', e => {
      if(e.target === modal) closeModal();
    });
    document.getElementById('askBtn').addEventListener('click', () => {
      const input = document.getElementById('question');
      const output = document.getElementById('output');
      const q = input.value.trim();
      output.style.display = 'block';
      output.textContent = q
        ? `La IA puede ayudarte a analizar, crear, automatizar y encontrar patrones a partir de tu necesidad: “${q}”.`
        : 'Escribe una pregunta para explorar una posible aplicación de inteligencia artificial.';
    });
    document.querySelector('.menu').addEventListener('click', () => {
      const links = document.querySelector('.nav-links');
      const visible = links.style.display === 'flex';
      links.style.display = visible ? '' : 'flex';
      links.style.position = 'absolute';
      links.style.top = '74px';
      links.style.left = '0';
      links.style.right = '0';
      links.style.padding = '20px';
      links.style.flexDirection = 'column';
      links.style.background = 'rgba(7,11,23,.96)';
    });
  </script>
